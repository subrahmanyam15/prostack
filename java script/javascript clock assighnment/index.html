<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Clock</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="clock-box">

            <h1>Digital Clock</h1>

            <p id="day">Wednesday</p>

            <p id="date">September 24, 2026</p>

            <div id="clock">
                00 : 00 : 00
            </div>

            <p id="ampm">AM</p>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
